<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>Student Portal</h1>

    <nav>
        <ul>
            <li><a href="#hero">Home</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#profile">Profile</a></li>
            <li><a href="#grades">Grades</a></li>
        </ul>
    </nav>

</header>

<main>

    <section id="hero">

        <h1>Welcome to the Student Portal</h1>

        <p>
            Explore courses, track your progress,
            and manage your academic journey.
        </p>

        <button>Explore Courses</button>

    </section>

    <input
        type="text"
        id="search-courses"
        placeholder="Search courses..."
    >

    <button id="sort-credits">
        Sort by Credits
    </button>

    <section id="courses">

        <h2>Available Courses</h2>

        <p id="loading">Loading courses...</p>

        <div id="course-grid" class="course-grid"></div>

        <p id="total-credits"></p>

    </section>

    <div id="selected-course"></div>

    <div id="spinner" class="spinner"></div>

    <section id="notifications">

        <h2>Notifications</h2>

    </section>

</main>

<footer>

    <p>&copy; 2026 Student Portal</p>

</footer>

<script src='https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js'></script>
<script type="module" src="app.js"></script>
</body>
</html>
